<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GoldCash</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --bg: #0a0d12;
    --surface: #141821;
    --surface-2: #1b202b;
    --border: rgba(255,255,255,.06);
    --border-hi: rgba(255,255,255,.12);
    --text: #e8eaed;
    --muted: #7c8290;
    --accent: #fbbf24;
    --accent-dk: #d99e0b;
    --green: #10b981;
    --red: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--text); font-family: -apple-system, "SF Pro Display", "Inter", system-ui, sans-serif; }
  body { -webkit-tap-highlight-color: transparent; min-height: 100vh; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }

  /* ============== BETA LABEL ============== */
  .brand { font-weight: 900; letter-spacing: -.04em; font-size: 20px; }
  .brand .dot { color: var(--accent); }

  /* ============== TOP BAR ============== */
  .topbar { background: var(--bg); border-bottom: 1px solid var(--border); }
  .balance-pill {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; gap: 6px;
  }
  .balance-pill .coin { color: var(--accent); font-weight: 900; }

  .btn-accent {
    background: var(--accent); color: #0a0d12;
    border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 800;
    border: none; cursor: pointer;
  }
  .btn-accent:active { background: var(--accent-dk); }
  .btn-ghost {
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border-hi);
    border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 700;
    cursor: pointer;
  }

  .avatar {
    width: 32px; height: 32px; border-radius: 8px;
    background: linear-gradient(180deg, #2a2f3c, #1a1f28);
    border: 1px solid var(--border-hi);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 800;
  }

  /* ============== SECTIONS ============== */
  .section-title {
    font-size: 13px; font-weight: 800;
    text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted);
    display: flex; align-items: center; gap: 8px;
  }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 3px rgba(239,68,68,.15); }

  /* ============== LIVE TICKER ============== */
  .live-item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 10px; min-width: 160px;
    display: flex; align-items: center; gap: 10px;
  }
  .live-item .av {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(180deg, #2a2f3c, #1a1f28);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 800; flex-shrink: 0;
  }
  .live-item .name { font-size: 11px; color: var(--muted); font-weight: 600; }
  .live-item .amt { font-size: 13px; font-weight: 800; color: var(--green); }
  .live-item .mult {
    margin-left: auto; font-size: 11px; font-weight: 800;
    color: var(--accent); padding: 2px 6px;
    background: rgba(251,191,36,.1); border-radius: 6px;
  }

  /* ============== GAME CARDS ============== */
  .game-card {
    display: flex; align-items: stretch;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    text-align: left;
    width: 100%;
    cursor: pointer;
    transition: border-color .15s;
  }
  .game-card:active { border-color: var(--border-hi); }
  .game-thumb {
    width: 96px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    position: relative;
    border-right: 1px solid var(--border);
  }
  .game-thumb.crash { background: linear-gradient(135deg, #2b1220, #1a0b14); }
  .game-thumb.mines { background: linear-gradient(135deg, #0f2620, #0a1814); }
  .game-thumb.roulette { background: linear-gradient(135deg, #2b1717, #1a0d0d); }
  .game-thumb.dice { background: linear-gradient(135deg, #1a2138, #101728); }
  .game-thumb.plinko { background: linear-gradient(135deg, #2b2312, #1a150a); }
  .game-thumb.blackjack { background: linear-gradient(135deg, #122b1f, #0a1a13); }
  .game-thumb.tower { background: linear-gradient(135deg, #241230, #150a1d); }
  .game-body { padding: 12px 14px; display: flex; flex-direction: column; justify-content: center; flex: 1; min-width: 0; }
  .game-title { font-size: 15px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 2px; }
  .game-sub { font-size: 11px; color: var(--muted); font-weight: 600; }
  .game-tag {
    font-size: 10px; font-weight: 800; letter-spacing: .04em;
    text-transform: uppercase; color: var(--green);
    background: rgba(16,185,129,.1);
    padding: 2px 6px; border-radius: 4px;
    display: inline-block; margin-top: 6px;
  }
  .game-cta {
    display: flex; align-items: center; padding-right: 14px;
    color: var(--accent); font-weight: 900; font-size: 18px;
  }

  /* ============== BOTTOM NAV ============== */
  .nav { background: var(--bg); border-top: 1px solid var(--border); }
  .nav-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 8px 0; color: var(--muted); background: none; border: none;
    font-size: 10px; font-weight: 700; letter-spacing: .02em;
  }
  .nav-btn.active { color: var(--accent); }
  .nav-btn svg { width: 20px; height: 20px; }

  /* ============== MODALS ============== */
  .modal { position: fixed; inset: 0; display: none; background: rgba(0,0,0,.7); align-items: flex-end; z-index: 100; }
  .modal.open { display: flex; }
  .modal-box {
    width: 100%; background: var(--surface);
    border-top: 1px solid var(--border-hi);
    border-top-left-radius: 16px; border-top-right-radius: 16px;
    padding: 20px 20px 28px;
  }
  .modal-title { font-size: 17px; font-weight: 800; letter-spacing: -.02em; }
  .modal-close { color: var(--muted); font-size: 22px; line-height: 1; font-weight: 300; }

  #modal-game { position: fixed; inset: 0; display: none; background: var(--bg); flex-direction: column; z-index: 200; }
  #modal-game.open { display: flex; }
  #modal-rules { z-index: 9999 !important; }
  #toast { z-index: 10000; }

  /* ============== INPUTS ============== */
  .inp {
    width: 100%; background: var(--surface-2);
    border: 1px solid var(--border-hi);
    border-radius: 10px;
    padding: 12px 14px; font-size: 16px; color: var(--text);
    outline: none;
  }
  .inp:focus { border-color: var(--accent); }
  .inp-sm { padding: 8px 12px; font-size: 14px; }
  select.inp { appearance: none; }

  .quick-btn {
    flex: 1; background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 0; font-size: 12px; font-weight: 700;
    color: var(--text);
  }
  .quick-btn:active { border-color: var(--accent); color: var(--accent); }

  /* ============== SUBMIT BUTTONS ============== */
  .submit {
    width: 100%; background: var(--accent); color: #0a0d12;
    border: none; border-radius: 12px;
    padding: 14px; font-size: 15px; font-weight: 900;
    letter-spacing: -.01em;
    cursor: pointer;
  }
  .submit:active { background: var(--accent-dk); }
  .submit-green { background: var(--green); color: #031b12; }
  .submit-green:active { background: #0a8c62; }

  /* ============== GAME BALANCE BAR ============== */
  .game-balance {
    background: rgba(251,191,36,.08); color: var(--accent);
    border: 1px solid rgba(251,191,36,.2);
    font-weight: 800; padding: 4px 10px; border-radius: 8px; font-size: 12px;
  }

  /* ============== CELL / BET GRID ============== */
  .bet-grid { display: grid; gap: 6px; }
  .bet-cell {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 6px; font-size: 12px; font-weight: 700;
    color: var(--text); text-align: center;
    transition: border-color .15s;
  }
  .bet-cell:active, .bet-cell.selected { border-color: var(--accent); color: var(--accent); }

  /* ============== CARD ELEMENT (bj) ============== */
  .bj-card {
    display: inline-flex; align-items: center; justify-content: center;
    width: 54px; height: 76px;
    background: #f4f5f7; color: #0a0d12;
    border-radius: 6px;
    font-weight: 900; font-size: 18px;
    margin: 0 3px;
    border: 1px solid rgba(0,0,0,.15);
    box-shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  .bj-card.red { color: #d33; }
  .bj-card.back {
    background: repeating-linear-gradient(45deg, #1e2a4a, #1e2a4a 6px, #16203a 6px, #16203a 12px);
    color: var(--accent); font-size: 16px;
  }

  /* ============== ANIMATIONS ============== */
  @keyframes balUp { 0%{color:var(--text)} 50%{color:var(--green)} 100%{color:var(--text)} }
  @keyframes balDown { 0%{color:var(--text)} 50%{color:var(--red)} 100%{color:var(--text)} }
  .bal-flash-up { animation: balUp .5s ease; }
  .bal-flash-down { animation: balDown .5s ease; }
  @keyframes pulse-slow { 0%,100%{opacity:1} 50%{opacity:.5} }
  .pulse-slow { animation: pulse-slow 1.6s ease-in-out infinite; }
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.08)} 100%{transform:scale(1)} }
  .pop { animation:pop .25s ease; }
  @keyframes skeleton-pulse { 0%,100%{opacity:.3} 50%{opacity:.6} }
  .skeleton { background: var(--surface-2); border-radius: 8px; animation: skeleton-pulse 1.4s ease-in-out infinite; }
  .skeleton-row { height: 48px; margin-bottom: 8px; }

  /* ============== DICE ============== */
  .dice-face { font-size: 96px; line-height: 1; text-align: center; }
  @keyframes dice-roll { 0%{transform:rotate(0) scale(1)} 25%{transform:rotate(90deg) scale(1.15)} 50%{transform:rotate(180deg) scale(.9)} 75%{transform:rotate(270deg) scale(1.15)} 100%{transform:rotate(360deg) scale(1)} }
  .dice-rolling { animation: dice-roll .5s ease infinite; }

  /* ============== PLINKO ============== */
  .plinko-board { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 12px 0; }
  .plinko-row { display: flex; gap: 6px; }
  .plinko-peg { width: 6px; height: 6px; background: rgba(255,255,255,.25); border-radius: 50%; }
  .plinko-slot { display: flex; gap: 3px; justify-content: center; margin-top: 8px; }
  .plinko-cell { min-width: 26px; padding: 5px 2px; text-align: center; font-size: 9px; font-weight: 800; border-radius: 4px; }

  /* ============== TOWER ============== */
  .tower-row { display: flex; gap: 6px; justify-content: center; margin-bottom: 6px; }
  .tower-door {
    flex: 1; padding: 12px 0; text-align: center; border-radius: 8px;
    background: var(--surface-2); cursor: pointer; font-weight: 700;
    border: 1px solid var(--border); font-size: 18px;
  }
  .tower-door.active { border-color: var(--accent); }
  .tower-door.safe { background: rgba(16,185,129,.15); border-color: var(--green); }
  .tower-door.mine { background: rgba(239,68,68,.15); border-color: var(--red); }
  .tower-door.locked { opacity: .35; pointer-events: none; }

  /* ============== WHEEL ============== */
  .wheel-wrap { position: relative; width: 220px; height: 220px; margin: 0 auto; }
  .wheel-pointer {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 9px solid transparent; border-right: 9px solid transparent;
    border-top: 14px solid var(--accent); z-index: 3;
  }
  .wheel {
    width: 100%; height: 100%; border-radius: 50%;
    transition: transform 4.5s cubic-bezier(.17,.67,.12,.99);
    border: 3px solid var(--surface-2);
    position: relative;
  }
  .wheel-center {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--bg); border: 2px solid var(--border-hi);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 20px; z-index: 2; color: var(--text);
  }

  /* ============== ROW / LIST ITEM ============== */
  .row-item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
  }
  .row-av {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(180deg, #2a2f3c, #1a1f28);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 800; flex-shrink: 0;
  }
  .row-name { font-weight: 700; font-size: 13px; }
  .row-sub { font-size: 10px; color: var(--muted); margin-top: 1px; }
  .row-amt { font-weight: 800; font-size: 13px; }

  /* ============== TOAST ============== */
  #toast {
    background: #1b202b; border: 1px solid var(--border-hi);
    border-radius: 10px; font-size: 13px; font-weight: 600;
    padding: 10px 14px;
  }
</style>
</head>
<body>

<header class="fixed top-0 left-0 right-0 z-40 topbar">
  <div class="flex items-center justify-between px-4 py-3">
    <div class="brand">Gold<span class="dot">Cash</span></div>
    <div class="flex items-center gap-2">
      <div id="balance-pill" class="balance-pill">
        <span class="coin">₮</span>
        <span id="balance">0.00</span>
      </div>
      <button id="btn-deposit" class="btn-accent">Пополнить</button>
      <div id="avatar" class="avatar">?</div>
    </div>
  </div>
</header>

<main class="pt-16 pb-24 px-4">

  <!-- LIVE -->
  <section class="mt-4">
    <div class="flex items-center justify-between mb-3">
      <div class="section-title">
        <span class="live-dot pulse-slow"></span>
        <span>Live выигрыши</span>
      </div>
    </div>
    <div id="live" class="flex overflow-x-auto no-scrollbar gap-2">
      <div class="skeleton shrink-0 w-[160px] h-[54px]"></div>
      <div class="skeleton shrink-0 w-[160px] h-[54px]"></div>
      <div class="skeleton shrink-0 w-[160px] h-[54px]"></div>
    </div>
  </section>

  <!-- GAMES -->
  <section class="mt-7">
    <div class="flex items-center justify-between mb-3">
      <div class="section-title">Игры</div>
      <button id="btn-rules-all" class="text-xs text-gray-500 underline">RTP и правила</button>
    </div>
    <div id="games" class="flex flex-col gap-2.5"></div>
  </section>

</main>

<nav class="fixed bottom-0 left-0 right-0 z-40 nav">
  <div class="grid grid-cols-4 py-1.5">
    <button class="nav-btn active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5"/>
      </svg>
      <span>Игры</span>
    </button>
    <button id="btn-top" class="nav-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 3l2.7 5.5 6 .9-4.3 4.2 1 6-5.4-2.8L6.6 19.6l1-6L3.3 9.4l6-.9z"/>
      </svg>
      <span>Топ</span>
    </button>
    <button id="btn-friends" class="nav-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="8" r="3.5"/>
        <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
        <circle cx="17" cy="9" r="2.5"/>
        <path d="M15 14c3 0 6 2 6 5"/>
      </svg>
      <span>Друзья</span>
    </button>
    <button id="btn-profile" class="nav-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>
      </svg>
      <span>Профиль</span>
    </button>
  </div>
</nav>

<!-- DEPOSIT -->
<div id="modal-deposit" class="modal">
  <div class="modal-box">
    <div class="flex justify-between items-center mb-4">
      <h3 class="modal-title">Пополнение</h3>
      <button class="close-modal modal-close">×</button>
    </div>
    <div class="flex items-center gap-2 mb-3">
      <label class="text-xs text-gray-500 font-bold uppercase tracking-wider">Валюта</label>
      <select id="deposit-currency" class="inp inp-sm flex-1">
        <option value="USDT">USDT</option><option value="TON">TON</option>
        <option value="BTC">BTC</option><option value="ETH">ETH</option>
        <option value="TRX">TRX</option>
      </select>
    </div>
    <label class="text-xs text-gray-500 font-bold uppercase tracking-wider">Сумма</label>
    <input id="deposit-amount" type="number" inputmode="decimal" min="0.1" step="0.01"
      class="inp mt-2 mb-3" placeholder="1">
    <div class="flex gap-2 mb-4">
      <button class="deposit-quick quick-btn" data-v="0.5">0.5</button>
      <button class="deposit-quick quick-btn" data-v="1">1</button>
      <button class="deposit-quick quick-btn" data-v="5">5</button>
      <button class="deposit-quick quick-btn" data-v="10">10</button>
    </div>
    <button id="do-deposit" class="submit">Оплатить</button>
  </div>
</div>

<!-- WITHDRAW -->
<div id="modal-withdraw" class="modal">
  <div class="modal-box">
    <div class="flex justify-between items-center mb-4">
      <h3 class="modal-title">Вывод</h3>
      <button class="close-modal modal-close">×</button>
    </div>
    <div class="rounded-lg p-3 mb-3 text-xs" style="background:rgba(251,191,36,.08); border:1px solid rgba(251,191,36,.2); color:#fbbf24;">
      ⚠ Средства приходят на твой аккаунт <b>@xRocket</b>. Если ещё не зарегистрирован — сначала зайди туда.
    </div>
    <div class="flex items-center gap-2 mb-3">
      <label class="text-xs text-gray-500 font-bold uppercase tracking-wider">Валюта</label>
      <select id="withdraw-currency" class="inp inp-sm flex-1">
        <option value="USDT">USDT</option><option value="TON">TON</option>
        <option value="BTC">BTC</option><option value="ETH">ETH</option>
        <option value="TRX">TRX</option>
      </select>
    </div>
    <label class="text-xs text-gray-500 font-bold uppercase tracking-wider">Сумма</label>
    <input id="withdraw-amount" type="number" inputmode="decimal" min="0.5" step="0.01"
      class="inp mt-2 mb-2" placeholder="1">
    <p id="withdraw-note" class="text-xs text-gray-500 mb-4"></p>
    <button id="do-withdraw" class="submit">Вывести</button>
  </div>
</div>

<!-- PROFILE -->
<div id="modal-profile" class="modal">
  <div class="modal-box max-h-[90vh] overflow-y-auto no-scrollbar">
    <div class="flex justify-between items-center mb-4">
      <h3 class="modal-title">Профиль</h3>
      <button class="close-modal modal-close">×</button>
    </div>
    <div id="profile-body" class="space-y-3">
      <div class="skeleton skeleton-row"></div>
      <div class="skeleton skeleton-row"></div>
    </div>
  </div>
</div>

<!-- HISTORY -->
<div id="modal-history" class="modal">
  <div class="modal-box max-h-[90vh] overflow-y-auto no-scrollbar">
    <div class="flex justify-between items-center mb-4">
      <h3 class="modal-title">История</h3>
      <button class="close-modal modal-close">×</button>
    </div>
    <div class="flex gap-2 mb-3">
      <button class="hist-tab quick-btn selected" data-t="games">Игры</button>
      <button class="hist-tab quick-btn" data-t="tx">Транзакции</button>
    </div>
    <div id="history-body" class="space-y-2"></div>
  </div>
</div>

<!-- FAIRNESS -->
<div id="modal-fair" class="modal">
  <div class="modal-box max-h-[90vh] overflow-y-auto no-scrollbar">
    <div class="flex justify-between items-center mb-4">
      <h3 class="modal-title">Честность</h3>
      <button class="close-modal modal-close">×</button>
    </div>
    <div id="fair-body" class="space-y-2"></div>
  </div>
</div>

<!-- TOP -->
<div id="modal-top" class="modal">
  <div class="modal-box max-h-[90vh] overflow-y-auto no-scrollbar">
    <div class="flex justify-between items-center mb-4">
      <h3 class="modal-title">Топ игроков</h3>
      <button class="close-modal modal-close">×</button>
    </div>
    <div class="flex gap-2 mb-3">
      <button class="lb-tab quick-btn" data-p="day">День</button>
      <button class="lb-tab quick-btn selected" data-p="week">Неделя</button>
      <button class="lb-tab quick-btn" data-p="month">Месяц</button>
    </div>
    <div id="top-body" class="space-y-2"></div>
  </div>
</div>

<!-- FRIENDS -->
<div id="modal-bonus" class="modal">
  <div class="modal-box max-h-[90vh] overflow-y-auto no-scrollbar">
    <div class="flex justify-between items-center mb-4">
      <h3 class="modal-title">Друзья и промокод</h3>
      <button class="close-modal modal-close">×</button>
    </div>

function toast(msg, ms=2500) {
  const t = document.getElementById("toast");

}

async function api(path, opts={}) {
  const res = await fetch(`${API_URL}${path}`, {
    ...opts, headers: {"Content-Type":"application/json",
      "X-Telegram-Init-Data": tg.initData, ...(opts.headers||{})},
  });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
  return data;
}
function openModal(id){ const m=document.getElementById(id); if (m) m.classList.add("open"); }

function renderProfile() {
  const b = num(profile?.balance).toFixed(2);
  document.getElementById("balance").innerText = b;
  const gb = document.getElementById("game-balance");
  if (gb) gb.innerText = b;
  const name = (profile?.first_name || profile?.username || "?").trim();
  document.getElementById("avatar").innerText = name[0].toUpperCase();
  const cur = profile?.preferred_currency || "USDT";
  const dc = document.getElementById("deposit-currency");
  const wc = document.getElementById("withdraw-currency");
  if (dc) dc.value = cur;
  if (wc) wc.value = cur;
}
function updateBalance(v, animate = true) {
  const old = num(profile?.balance);
  profile.balance = num(v);
  const target = num(v);
  const el = document.getElementById("balance");
  const gb = document.getElementById("game-balance");
  const pill = document.getElementById("balance-pill");
  if (animate && target !== old) {
    const cls = target > old ? "bal-flash-up" : "bal-flash-down";
    el.classList.remove("bal-flash-up","bal-flash-down");
    void el.offsetWidth; el.classList.add(cls);
    setTimeout(()=>el.classList.remove(cls), 600);
    if (gb) {
      gb.classList.remove("bal-flash-up","bal-flash-down");
      void gb.offsetWidth; gb.classList.add(cls);
      setTimeout(()=>gb.classList.remove(cls), 600);
    }
    pill.classList.add("pop"); setTimeout(()=>pill.classList.remove("pop"), 250);
  }
  const start = _displayedBalance;
  const delta = target - start;
  if (!animate || Math.abs(delta) < 0.01) {
    _displayedBalance = target;
    el.innerText = target.toFixed(2);
    if (gb) gb.innerText = target.toFixed(2);
    return;
  }
  const dur = 400; const t0 = performance.now();
  function tick(t) {
    const k = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    const cur = start + delta * e;
    el.innerText = cur.toFixed(2);
    if (gb) gb.innerText = cur.toFixed(2);
    if (k < 1) requestAnimationFrame(tick); else _displayedBalance = target;
  }
  requestAnimationFrame(tick);
}

  document.querySelectorAll(".lb-tab").forEach(x => x.classList.remove("selected"));
  b.classList.add("selected"); loadLeaderboard(b.dataset.p);
}));

document.addEventListener("click", e => {
  const card = e.target.closest(".game-card");
  if (!card) return;
  currentGame = card.dataset.id;
  document.getElementById("game-title").innerText = card.dataset.title;
  const gb = document.getElementById("game-balance");
  if (gb) gb.innerText = num(profile?.balance).toFixed(2);
  openModal("modal-game");
  if (currentGame === "crash") renderCrash();
  else if (currentGame === "mines") renderMines();
  else if (currentGame === "roulette") renderRoulette();
  else if (currentGame === "dice") renderDice();
  else if (currentGame === "plinko") renderPlinko();
  else if (currentGame === "blackjack") renderBlackjack();
  else if (currentGame === "tower") renderTower();
});

function betInputRow(id="bet-input", val=0.5) {
  return `
    <div class="flex items-center gap-2">
      <button class="bet-minus btn-ghost" style="width:40px; height:40px; padding:0; font-size:18px;">−</button>
      <input id="${id}" type="number" value="${val}" min="${cfg.min_bet}" max="${cfg.max_bet}" step="0.1"
        class="inp flex-1 text-center" style="font-size:16px; font-weight:700;">
      <button class="bet-plus btn-ghost" style="width:40px; height:40px; padding:0; font-size:18px;">+</button>
    </div>
    <div class="text-[10px] text-center mt-1" style="color:var(--muted)">мин ${cfg.min_bet} · макс ${cfg.max_bet}</div>
    <div class="flex gap-2 mt-2">
      ${[0.1,0.5,1,5,10].map(v=>`<button class="bet-quick quick-btn" data-v="${v}">${v}</button>`).join("")}
    </div>`;
}
function wireBet(scope, getEl) {
  scope.querySelectorAll(".bet-quick").forEach(b =>
    b.onclick = () => { getEl().value = Math.min(cfg.max_bet, b.dataset.v); });
  scope.querySelector(".bet-minus")?.addEventListener("click", () => {
    getEl().value = Math.max(cfg.min_bet, +(Number(getEl().value||cfg.min_bet) - 0.1).toFixed(2)); });
  scope.querySelector(".bet-plus")?.addEventListener("click", () => {
    getEl().value = Math.min(cfg.max_bet, +(Number(getEl().value||cfg.min_bet) + 0.1).toFixed(2)); });
}
function validateBet(v) {
  if (!v || v < cfg.min_bet) { toast(`Мин. ставка ${cfg.min_bet}`); return false; }
  if (v > cfg.max_bet) { toast(`Макс. ставка ${cfg.max_bet}`); return false; }
  return true;
}

/* ============ CRASH ============ */
function renderCrash() {
  const body = document.getElementById("game-body");
  body.innerHTML = `
    <div class="flex flex-col h-full gap-3">
      <div id="crash-history" class="flex gap-1.5 overflow-x-auto no-scrollbar"></div>
      <div class="rounded-2xl flex flex-col items-center justify-center min-h-[200px]" style="background:var(--surface); border:1px solid var(--border);">
        <div id="crash-mult" class="text-6xl font-black tabular-nums" style="letter-spacing:-.04em;">1.00x</div>
        <div id="crash-status" class="mt-2 text-sm" style="color:var(--muted);">Подключение…</div>
        <div id="crash-timer" class="text-xs mt-1" style="color:var(--muted);"></div>
      </div>
      <div id="crash-betbox-inner">
        ${betInputRow("crash-bet", 0.5)}
        <div class="row-item mt-2 flex-col items-stretch">
          <label class="flex items-center gap-2 text-xs">
            <input type="checkbox" id="crash-auto-on" class="w-4 h-4">
            <span class="font-bold">АВТО-ВЫВОД НА</span>
            <input id="crash-auto-mult" type="number" step="0.1" min="1.01" value="2.0" class="inp inp-sm flex-1 text-center" style="padding:4px;">
            <span class="font-bold">×</span>
          </label>
        </div>
        <button id="crash-bet-btn" class="submit mt-3">Сделать ставку</button>
      </div>
      <button id="crash-cashout-btn" class="submit submit-green hidden mt-3">Забрать</button>
      <div id="crash-my-status" class="text-center text-sm mt-2" style="color:var(--muted);"></div>
      <div>
        <div class="section-title mb-2">Ставки в раунде · <span id="crash-bets-count">0</span></div>
        <div id="crash-bets-list" class="space-y-1.5 max-h-[240px] overflow-y-auto no-scrollbar"></div>
      </div>
    </div>`;
  const betEl = () => body.querySelector("#crash-bet");
  wireBet(body, betEl);
  refreshCrashState();
  if (crashPoll) clearInterval(crashPoll);
  crashPoll = setInterval(refreshCrashState, 700);
  body.querySelector("#crash-bet-btn").onclick = async () => {
    const bet = Number(betEl().value);
    if (!validateBet(bet)) return;
    const autoOn = body.querySelector("#crash-auto-on").checked;
    const autoMult = autoOn ? Number(body.querySelector("#crash-auto-mult").value) : null;
    if (autoOn && (!autoMult || autoMult < 1.01 || autoMult > 100)) return toast("Авто 1.01..100");
    haptic();
    try {
      await api("/api/crash/bet", { method:"POST", body:JSON.stringify({ bet, auto_cashout_mult: autoMult }) });
      updateBalance(num(profile.balance) - bet);
      toast(autoMult ? `Принято (авто ×${autoMult})` : "Ставка принята");
      refreshCrashState();
    } catch (e) { toast(e.message); }
  };
  body.querySelector("#crash-cashout-btn").onclick = async () => {
    haptic("medium");
    try {
      const r = await api("/api/crash/cashout", { method:"POST" });
      toast(`Забрано ×${r.mult} = +${num(r.profit).toFixed(2)}`);
      updateBalance(num(profile.balance) + num(r.payout));
      refreshCrashState();
    } catch (e) { toast(e.message); }
  };
}
async function refreshCrashState() {
  try {
    const st = await api("/api/crash/state");
    if (currentGame !== "crash") return;
    const body = document.getElementById("game-body");
    if (!body) return;
    const hist = body.querySelector("#crash-history");
    if (hist) {
      const pills = (st.recent || []).map(r => {
        const cp = num(r.crash_point);
        let color;
        if (cp < 2) color = "color:#ef4444; background:rgba(239,68,68,.1);";
        else if (cp < 5) color = "color:#fbbf24; background:rgba(251,191,36,.1);";
        else color = "color:#10b981; background:rgba(16,185,129,.1);";
        return `<span class="shrink-0 rounded-md px-2 py-1 text-xs font-black" style="${color}">${cp.toFixed(2)}x</span>`;
      }).join("");
      hist.innerHTML = pills || `<span class="text-xs" style="color:var(--muted);">Нет раундов</span>`;
    }
    const multEl = body.querySelector("#crash-mult");
    const statusEl = body.querySelector("#crash-status");
    const timerEl = body.querySelector("#crash-timer");
    const betBox = body.querySelector("#crash-betbox-inner");
    const cashBtn = body.querySelector("#crash-cashout-btn");
    const myStatus = body.querySelector("#crash-my-status");
    if (st.status === "running") {
      const startedAt = st.started_at;
      if (startedAt) {
        const tick = () => {
          const elapsed = (Date.now()/1000) - startedAt;
          const m = Math.max(1, Math.pow(1.07, elapsed)).toFixed(2);
          if (multEl) multEl.innerText = `${m}x`;
          crashLocalAnim = requestAnimationFrame(tick);
        };
        if (crashLocalAnim) cancelAnimationFrame(crashLocalAnim);
        tick();
      }
      statusEl.innerHTML = `<span style="color:var(--green); font-weight:700;">● Раунд идёт</span>`;
      timerEl.innerText = "";
    } else if (st.status === "betting") {
      if (crashLocalAnim) { cancelAnimationFrame(crashLocalAnim); crashLocalAnim = null; }
      if (multEl) multEl.innerText = "1.00x";
      statusEl.innerHTML = `<span style="color:var(--accent); font-weight:700;">● Приём ставок</span>`;
      timerEl.innerText = `${Math.ceil(num(st.betting_ends_in))} сек`;
    } else if (st.status === "crashed") {
      if (crashLocalAnim) { cancelAnimationFrame(crashLocalAnim); crashLocalAnim = null; }
      if (multEl) multEl.innerText = `${num(st.crash_point).toFixed(2)}x`;
      statusEl.innerHTML = `<span style="color:var(--red); font-weight:700;">💥 Краш</span>`;
      timerEl.innerText = "";
    } else {
      if (crashLocalAnim) { cancelAnimationFrame(crashLocalAnim); crashLocalAnim = null; }
      if (multEl) multEl.innerText = "1.00x";
      statusEl.innerText = "Ожидание…";
    }
    const my = st.my_bet;
    const canBet = st.status === "betting" && !my;
    const canCash = st.status === "running" && my && my.status === "active";
    betBox.classList.toggle("hidden", !canBet);
    cashBtn.classList.toggle("hidden", !canCash);
    if (my) {
      if (my.status === "active") {
        const auto = my.auto_cashout_mult ? ` · авто ×${num(my.auto_cashout_mult).toFixed(2)}` : "";
        myStatus.innerHTML = `<span style="color:var(--accent); font-weight:700;">Ставка ${num(my.amount).toFixed(2)}${auto}</span>`;
      }
      else if (my.status === "cashed") myStatus.innerHTML = `<span style="color:var(--green); font-weight:700;">+${num(my.payout - my.amount).toFixed(2)} на ×${num(my.cashout_mult).toFixed(2)}</span>`;
      else if (my.status === "lost") myStatus.innerHTML = `<span style="color:var(--red); font-weight:700;">−${num(my.amount).toFixed(2)}</span>`;
    } else if (st.status === "running") myStatus.innerHTML = `<span style="color:var(--muted);">Ты не в этом раунде</span>`;
    else myStatus.innerHTML = "";
    const listEl = body.querySelector("#crash-bets-list");
    const countEl = body.querySelector("#crash-bets-count");
    if (countEl) countEl.innerText = String((st.bets || []).length);
    if (listEl) {
      if (!st.bets || st.bets.length === 0) {
        listEl.innerHTML = `<div class="text-xs text-center py-3" style="color:var(--muted);">Пока никто не поставил</div>`;
      } else {
        listEl.innerHTML = st.bets.map(b => {
          let right = ""; let color = "var(--muted)";
          if (b.status === "active") { right = `${num(b.amount).toFixed(2)}${b.auto_cashout_mult ? ' ⚡'+num(b.auto_cashout_mult).toFixed(2)+'×' : ''}`; color = "var(--accent)"; }
          else if (b.status === "cashed") { right = `+${num(b.payout - b.amount).toFixed(2)} ×${num(b.cashout_mult).toFixed(2)}`; color = "var(--green)"; }
          else if (b.status === "lost") { right = `−${num(b.amount).toFixed(2)}`; color = "var(--red)"; }
          return `<div class="row-item" style="${b.is_me?'border-color:var(--accent);':''}">
            <div class="flex items-center gap-2">
              <div class="row-av">${(b.username||"?").charAt(0).toUpperCase()}</div>
              <span class="row-name">${b.username}${b.is_me?' <span style="color:var(--accent)">(ты)</span>':''}</span>
            </div>
            <div class="row-amt" style="color:${color}">${right}</div>
          </div>`;
        }).join("");
      }
    }
    updateBalance(num(st.balance), false);
  } catch (e) {}
}

/* ============ MINES ============ */
function renderMines() {
  const body = document.getElementById("game-body");
  let minesCount = 3;
  body.innerHTML = `
    <div class="flex flex-col h-full">
      <div class="flex items-center gap-2 mb-3">
        <span class="text-xs font-bold" style="color:var(--muted);">МИН:</span>
        ${[1,3,5,10].map(n=>`<button class="mines-count quick-btn ${n===3?'selected':''}" data-n="${n}">${n}</button>`).join("")}
      </div>
      <div class="rounded-2xl p-3 mb-3" style="background:var(--surface); border:1px solid var(--border);">
        <div class="grid grid-cols-5 gap-2" id="mines-grid"></div>
      </div>
      <div class="flex items-center justify-between mb-3">
        <div class="text-sm" style="color:var(--muted);">Множитель: <span id="mines-mult" class="font-black" style="color:var(--text);">1.00×</span></div>
        <div class="text-sm" style="color:var(--muted);">Открыто: <span id="mines-revealed" class="font-black" style="color:var(--text);">0</span></div>
      </div>
      <div id="mines-bet-wrap">
        ${betInputRow("mines-bet", 0.5)}
        <button id="mines-start" class="submit mt-3">Старт</button>
      </div>
      <button id="mines-cashout" class="submit submit-green hidden mt-3">Забрать</button>
      <div id="mines-result" class="text-center mt-3 text-sm"></div>
    </div>`;
  const betEl = () => body.querySelector("#mines-bet");
  wireBet(body, betEl);
  const grid = body.querySelector("#mines-grid");
  function renderGrid(revealed=[], positions=null, lost=false) {
    grid.innerHTML = Array.from({length:25}, (_,i) => {
      const r = revealed.includes(i);
      const mine = positions && positions.includes(i);
      let cls = "aspect-square rounded-lg flex items-center justify-center text-xl font-bold";
      let style = "cursor:pointer; transition: transform .1s;";
      let inner = "";
      if (r) {
        if (lost && mine) style += "background:rgba(239,68,68,.3); border:1px solid var(--red);";
        else style += "background:rgba(16,185,129,.2); border:1px solid var(--green);";
        inner = mine ? "💣" : "💎";
      } else if (lost && mine) {
        style += "background:rgba(239,68,68,.15); border:1px solid rgba(239,68,68,.5);";
        inner = "💣";
      } else {
        style += "background:var(--surface-2); border:1px solid var(--border);";
      }
      return `<button class="${cls}" style="${style}" data-i="${i}">${inner}</button>`;
    }).join("");
  }
  renderGrid();
  body.querySelectorAll(".mines-count").forEach(b => b.onclick = () => {
    if (!body.querySelector("#mines-start").classList.contains("hidden")) {
      minesCount = Number(b.dataset.n);
      body.querySelectorAll(".mines-count").forEach(x => x.classList.remove("selected"));
      b.classList.add("selected");
    }
  });
  body.querySelector("#mines-start").onclick = async () => {
    const bet = Number(betEl().value);
    if (!validateBet(bet)) return;
    haptic();
    try {
      await api("/api/games/mines/start", { method:"POST", body:JSON.stringify({ bet, mines: minesCount }) });
      updateBalance(num(profile.balance) - bet);
      body.querySelector("#mines-bet-wrap").classList.add("hidden");
      body.querySelector("#mines-cashout").classList.remove("hidden");
      body.querySelector("#mines-result").innerHTML = "";
      renderGrid(); bindCells();
    } catch (e) { toast(e.message); }
  };
  body.querySelector("#mines-cashout").onclick = async () => {
    haptic("medium");
    try {
      const r = await api("/api/games/mines/cashout", { method:"POST" });
      body.querySelector("#mines-cashout").classList.add("hidden");
      body.querySelector("#mines-bet-wrap").classList.remove("hidden");
      updateBalance(num(profile.balance) + num(r.payout));
      body.querySelector("#mines-result").innerHTML = `<span style="color:var(--green); font-weight:700;">+${num(r.profit).toFixed(2)} (${r.mult}×)</span>`;
      renderGrid(r.positions, r.positions, false);
      body.querySelector("#mines-mult").innerText = "1.00×";
      body.querySelector("#mines-revealed").innerText = "0";
    } catch (e) { toast(e.message); }
  };
  function bindCells() {
    grid.querySelectorAll("button").forEach(b => b.onclick = async () => {
      const idx = Number(b.dataset.i);
      if (b.dataset.locked) return;
      haptic();
      try {
        const r = await api("/api/games/mines/reveal", { method:"POST", body:JSON.stringify({ cell: idx }) });
        if (r.lost) {
          body.querySelector("#mines-cashout").classList.add("hidden");
          body.querySelector("#mines-bet-wrap").classList.remove("hidden");
          renderGrid(r.positions, r.positions, true);
          body.querySelector("#mines-result").innerHTML = `<span style="color:var(--red); font-weight:700;">💥 Мина</span>`;
          body.querySelector("#mines-mult").innerText = "1.00×";
          body.querySelector("#mines-revealed").innerText = "0";
        } else {
          b.dataset.locked = "1";
          b.style.background = "rgba(16,185,129,.2)";
          b.style.border = "1px solid var(--green)";
          b.innerText = "💎";
          body.querySelector("#mines-mult").innerText = `${r.mult}×`;
          body.querySelector("#mines-revealed").innerText = String(r.revealed.length);
        }
      } catch (e) { toast(e.message); }
    });
  }
}

/* ============ ROULETTE ============ */
function renderRoulette() {
  const body = document.getElementById("game-body");
  const SEC = 37, ANG = 360 / SEC;
  const stops = [];
  for (let i = 0; i < SEC; i++) {
    const n = ROUL_ORDER[i];
    const color = n === 0 ? "#16a34a" : (RED_NUMS.has(n) ? "#dc2626" : "#111827");
    stops.push(`${color} ${-ANG/2 + i*ANG}deg ${-ANG/2 + (i+1)*ANG}deg`);
  }
  const gradient = `conic-gradient(${stops.join(",")})`;
  body.innerHTML = `
    <div class="flex flex-col h-full gap-3">
      <div class="rounded-2xl py-6" style="background:var(--surface); border:1px solid var(--border);">
        <div class="wheel-wrap">
          <div class="wheel-pointer"></div>
          <div id="wheel" class="wheel" style="background:${gradient}"></div>
          <div class="wheel-center" id="wheel-center">—</div>
        </div>
      </div>
      <div id="roul-message" class="text-center text-sm" style="color:var(--muted);">Выберите ставку</div>
      <div class="grid grid-cols-3 gap-2">
        <button class="roul-bet quick-btn" data-t="red" style="padding:12px 0;">🔴 Красное</button>
        <button class="roul-bet quick-btn" data-t="black" style="padding:12px 0;">⚫ Чёрное</button>
        <button class="roul-bet quick-btn" data-t="odd" style="padding:12px 0;">Нечёт</button>
        <button class="roul-bet quick-btn" data-t="even" style="padding:12px 0;">Чёт</button>
        <button class="roul-bet quick-btn" data-t="dozen1" style="padding:12px 0;">1–12</button>
        <button class="roul-bet quick-btn" data-t="dozen2" style="padding:12px 0;">13–24</button>
        <button class="roul-bet quick-btn col-span-3" data-t="dozen3" style="padding:12px 0;">25–36</button>
      </div>
      <div class="flex items-center gap-2">
        <input id="roul-num" type="number" min="0" max="36" placeholder="0–36" class="inp inp-sm flex-1 text-center">
        <button id="roul-num-btn" class="btn-accent" style="padding:8px 14px;">×${cfg.payouts.roulette_number}</button>
      </div>
      ${betInputRow("roul-bet", 0.5)}
      <button id="roul-spin" class="submit">Крутить</button>
      <div id="roul-result" class="text-center text-sm"></div>
    </div>`;
  const betEl = () => body.querySelector("#roul-bet");
  wireBet(body, betEl);
  let selected = null;
  const wheel = body.querySelector("#wheel");
  const center = body.querySelector("#wheel-center");
  let rotation = 0;
  body.querySelectorAll(".roul-bet").forEach(b => b.onclick = () => {
    selected = { type: b.dataset.t, value: null };
    body.querySelectorAll(".roul-bet").forEach(x => x.classList.remove("selected"));
    b.classList.add("selected");
    body.querySelector("#roul-message").innerHTML = `Выбрано: <b>${b.innerText}</b>`;
  });
  body.querySelector("#roul-num-btn").onclick = () => {
    const n = Number(body.querySelector("#roul-num").value);
    if (n < 0 || n > 36) return toast("Число 0–36");
    selected = { type: "number", value: n };
    body.querySelectorAll(".roul-bet").forEach(x => x.classList.remove("selected"));
    body.querySelector("#roul-message").innerHTML = `Выбрано: <b>число ${n}</b>`;
  };
  body.querySelector("#roul-spin").onclick = async () => {
    if (!selected) return toast("Выберите ставку");
    const bet = Number(betEl().value);
    if (!validateBet(bet)) return;
    haptic("medium");
    const spinBtn = body.querySelector("#roul-spin");
    spinBtn.disabled = true;
    body.querySelector("#roul-result").innerHTML = "";
    center.innerText = "…";
    try {
      const r = await api("/api/games/roulette/bet", { method:"POST",
        body: JSON.stringify({ bet, type: selected.type, value: selected.value }) });
      const idx = ROUL_ORDER.indexOf(r.number);
      const sectorCenter = idx * ANG + ANG / 2;
      rotation += 360 * 5 + (360 - sectorCenter - (rotation % 360));
      wheel.style.transform = `rotate(${rotation}deg)`;
      setTimeout(() => {
        const color = r.color === "red" ? "#ef4444" :
                      r.color === "black" ? "#e8eaed" : "#10b981";
        center.innerHTML = `<span style="color:${color}">${r.number}</span>`;
        const res = body.querySelector("#roul-result");
        if (r.win) {
          res.innerHTML = `<span style="color:var(--green); font-weight:700;">+${num(r.profit).toFixed(2)}</span>`;
          updateBalance(num(profile.balance) + num(r.payout));
        } else {
          res.innerHTML = `<span style="color:var(--red); font-weight:700;">−${num(bet).toFixed(2)}</span>`;
          updateBalance(num(profile.balance));
        }
        spinBtn.disabled = false;
      }, 4600);
    } catch (e) { toast(e.message); spinBtn.disabled = false; }
  };
}

    const bet = Number(betEl().value);
    if (!validateBet(bet)) return;
    haptic("medium");
    const faceEl = body.querySelector("#dice-face");
    const rollBtn = body.querySelector("#dice-roll");
    rollBtn.disabled = true;
    faceEl.classList.add("dice-rolling");
    body.querySelector("#dice-result").innerHTML = "";
    try {
      const r = await api("/api/games/dice/bet", { method:"POST",
        body: JSON.stringify({ bet, chosen }) });
      await new Promise(res => setTimeout(res, 700));
      faceEl.classList.remove("dice-rolling");
      faceEl.innerText = DICE_EMOJI[r.result] || "🎲";
      const res = body.querySelector("#dice-result");
      if (r.win) {
        res.innerHTML = `<span style="color:var(--green); font-weight:700;">Выпало ${r.result} · +${num(r.profit).toFixed(2)}</span>`;
        updateBalance(num(profile.balance) + num(r.payout));
      } else {
        res.innerHTML = `<span style="color:var(--red); font-weight:700;">Выпало ${r.result} · −${num(bet).toFixed(2)}</span>`;
        updateBalance(num(profile.balance));
      }
      rollBtn.disabled = false;
    } catch (e) { toast(e.message); faceEl.classList.remove("dice-rolling"); rollBtn.disabled = false; }
  };
}

/* ============ PLINKO ============ */
function renderPlinko() {
  const body = document.getElementById("game-body");
  let rows = 12;
  let lastSlot = null;
  function drawBoard() {
    const mults = cfg.payouts.plinko[rows] || [];
    let rowsHtml = "";
    for (let i = 0; i <= rows; i++) {
      rowsHtml += `<div class="plinko-row">${Array.from({length: i+1}, () => '<div class="plinko-peg"></div>').join("")}</div>`;
    }
    const cells = mults.map((m, i) => {
      const v = Number(m);
      let style;
      if (v >= 5) style = "background:rgba(239,68,68,.4); color:#fff;";
      else if (v >= 2) style = "background:rgba(251,191,36,.4); color:#fff;";
      else if (v >= 1) style = "background:rgba(251,191,36,.15); color:#fbbf24;";
      else style = "background:var(--surface-2); color:var(--muted);";
      const ring = (i === lastSlot) ? "outline:2px solid var(--accent);" : "";
      return `<div class="plinko-cell" style="${style}${ring}">${v}×</div>`;
    }).join("");
    return `
      <div class="rounded-2xl p-3" style="background:var(--surface); border:1px solid var(--border);">
        <div class="plinko-board">${rowsHtml}</div>
        <div class="plinko-slot">${cells}</div>
      </div>`;
  }
  function drawAll() {
    body.innerHTML = `
      <div class="flex flex-col h-full gap-3">
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold" style="color:var(--muted);">РЯДЫ:</span>
          ${[8,12,16].map(n=>`<button class="plinko-rows quick-btn ${n===rows?'selected':''}" data-n="${n}">${n}</button>`).join("")}
        </div>
        ${drawBoard()}
        <div id="plinko-message" class="text-center text-sm" style="color:var(--muted);">Ставь и бросай</div>
        ${betInputRow("plinko-bet", 0.5)}
        <button id="plinko-drop" class="submit">Бросить</button>
        <div id="plinko-result" class="text-center text-sm"></div>
      </div>`;
    const betEl = () => body.querySelector("#plinko-bet");
    wireBet(body, betEl);
    body.querySelectorAll(".plinko-rows").forEach(b => b.onclick = () => {
      rows = Number(b.dataset.n); lastSlot = null; drawAll();
    });
    body.querySelector("#plinko-drop").onclick = async () => {
      const bet = Number(betEl().value);
      if (!validateBet(bet)) return;
      haptic("medium");
      const btn = body.querySelector("#plinko-drop");
      btn.disabled = true;
      body.querySelector("#plinko-result").innerHTML = "";
      try {
        const r = await api("/api/games/plinko/drop", { method:"POST", body: JSON.stringify({ bet, rows }) });
        lastSlot = r.slot;
        const m = body.querySelector("#plinko-message");
        let step = 0;
        const interval = setInterval(() => {
          step++;
          m.innerHTML = `Шарик падает… ${step}/${rows}`;
          if (step >= rows) clearInterval(interval);
        }, 120);
        await new Promise(res => setTimeout(res, rows * 120 + 300));
        const board = body.querySelector(".rounded-2xl");
        const tmp = document.createElement("div");
        tmp.innerHTML = drawBoard();
        board.replaceWith(tmp.firstElementChild);
        m.innerHTML = `Упал в слот <b>${r.slot}</b> — ×${r.mult}`;
        const res = body.querySelector("#plinko-result");
        if (r.profit > 0) {
          res.innerHTML = `<span style="color:var(--green); font-weight:700;">+${num(r.profit).toFixed(2)}</span>`;
        } else {
          res.innerHTML = `<span style="color:var(--red); font-weight:700;">−${Math.abs(num(r.profit)).toFixed(2)}</span>`;
        }
        updateBalance(num(profile.balance) + num(r.payout));
        btn.disabled = false;
      } catch (e) { toast(e.message); btn.disabled = false; }
    };
  }
  drawAll();
}

/* ============ BLACKJACK ============ */
function cardHtml(c, hidden = false) {
  if (hidden) return `<div class="bj-card back">?</div>`;
  const suit = c[0], rank = c[1];
  const red = (suit === "H" || suit === "D");
  const suits = {S:"♠",H:"♥",D:"♦",C:"♣"};
  return `<div class="bj-card ${red?'red':''}">${rank}${suits[suit]}</div>`;
}
function renderBlackjack() {
  const body = document.getElementById("game-body");
  function drawGame(state) {
    const inGame = state && !state.finished;
    const playerCards = state ? state.player : [];
    const dealerCards = state ? state.dealer : [];
    const hideDealer = inGame;
    body.innerHTML = `
      <div class="flex flex-col h-full gap-3">
        <div class="rounded-2xl p-4 min-h-[140px]" style="background:var(--surface); border:1px solid var(--border);">
          <div class="section-title mb-2">Дилер ${state ? "· "+state.dealer_value : ""}</div>
          <div class="flex justify-center flex-wrap">${dealerCards.map((c,i) => cardHtml(c, hideDealer && i === 1)).join("") || '<div class="text-xs" style="color:var(--muted);">—</div>'}</div>
        </div>
        <div class="rounded-2xl p-4 min-h-[140px]" style="background:var(--surface); border:1px solid var(--border);">
          <div class="section-title mb-2">Ты ${state ? "· "+state.player_value : ""}</div>
          <div class="flex justify-center flex-wrap">${playerCards.map(c => cardHtml(c)).join("") || '<div class="text-xs" style="color:var(--muted);">—</div>'}</div>
        </div>
        <div id="bj-result" class="text-center text-sm"></div>
        <div id="bj-controls"></div>
      </div>`;
    const controls = body.querySelector("#bj-controls");
    if (!inGame) {
      controls.innerHTML = `
        ${betInputRow("bj-bet", 0.5)}
        <button id="bj-start" class="submit mt-3">Раздать</button>`;
      const betEl = () => body.querySelector("#bj-bet");
      wireBet(body, betEl);
      controls.querySelector("#bj-start").onclick = async () => {
        const bet = Number(betEl().value);
        if (!validateBet(bet)) return;
        haptic("medium");
        try {
          const r = await api("/api/games/blackjack/start", { method:"POST", body:JSON.stringify({ bet }) });
          updateBalance(num(profile.balance) - bet);
          drawGame(r);
          if (r.finished) showResult(r);
        } catch (e) { toast(e.message); }
      };
    } else {
      controls.innerHTML = `
        <div class="grid grid-cols-2 gap-3">
          <button id="bj-hit" class="submit">Ещё</button>
          <button id="bj-stand" class="submit submit-green">Хватит</button>
        </div>`;
      controls.querySelector("#bj-hit").onclick = async () => {
        haptic();
        try {
          const r = await api("/api/games/blackjack/hit", { method:"POST" });
          drawGame(r);
          if (r.finished) showResult(r);
        } catch (e) { toast(e.message); }
      };
      controls.querySelector("#bj-stand").onclick = async () => {
        haptic();
        try {
          const r = await api("/api/games/blackjack/stand", { method:"POST" });
          drawGame(r); showResult(r);
        } catch (e) { toast(e.message); }
      };
    }
  }
  function showResult(r) {
    const res = body.querySelector("#bj-result");
    if (!res) return;
    if (r.push) {
      res.innerHTML = `<span style="color:var(--accent); font-weight:700;">Ничья — ставка возвращена</span>`;
    } else if (r.win) {
      res.innerHTML = `<span style="color:var(--green); font-weight:700;">Победа · +${num(r.profit).toFixed(2)}</span>`;
      updateBalance(num(profile.balance) + num(r.payout));
    } else {
      res.innerHTML = `<span style="color:var(--red); font-weight:700;">Проигрыш · −${Math.abs(num(r.profit)).toFixed(2)}</span>`;
    }
    const again = document.createElement("button");
    again.className = "submit mt-3";
    again.innerText = "Ещё раз";
    again.onclick = () => drawGame(null);
    res.parentElement.appendChild(again);
  }
  drawGame(null);
}

/* ============ TOWER ============ */
function renderTower() {
  const body = document.getElementById("game-body");
  const LEVELS = 6;
  let active = false;
  let currentLevel = 0;
  let minePositions = null;
  function drawTower(revealed = []) {
    let html = "";
    for (let lvl = LEVELS - 1; lvl >= 0; lvl--) {
      const isActive = (lvl === currentLevel && active);
      const rev = revealed.find(x => x.level === lvl);
      let doors = "";
      for (let d = 0; d < 3; d++) {
        let cls = "tower-door";
        let inner = "🚪";
        if (rev) {
          if (d === rev.door) { cls += " safe"; inner = "✓"; }
          else cls += " locked";
        } else if (isActive) {
          cls += " active";
        } else if (lvl < currentLevel || !active) {
          cls += " locked";
        }
        doors += `<div class="${cls}" data-level="${lvl}" data-door="${d}">${inner}</div>`;
      }
      html += `<div class="tower-row">${doors}</div>`;
    }
    return html;
  }
  function drawAll(revealed = []) {
    const mult = currentLevel === 0 ? 1 : Number((1.44 ** currentLevel).toFixed(2));
    body.innerHTML = `
      <div class="flex flex-col h-full gap-3">
        <div class="flex items-center justify-between">
          <div class="text-sm" style="color:var(--muted);">Уровень: <b style="color:var(--text);">${currentLevel}</b></div>
          <div class="text-sm" style="color:var(--muted);">Множитель: <b style="color:var(--green);">×${mult}</b></div>
        </div>
        <div id="tower-board" class="rounded-2xl p-3" style="background:var(--surface); border:1px solid var(--border);">${drawTower(revealed)}</div>
        <div id="tower-result" class="text-center text-sm"></div>
        ${!active ? `
          ${betInputRow("tower-bet", 0.5)}
          <button id="tower-start" class="submit mt-3">Старт</button>` : `
          <button id="tower-cashout" class="submit submit-green">Забрать ×${mult}</button>`}
      </div>`;
    if (!active) {
      const betEl = () => body.querySelector("#tower-bet");
      wireBet(body, betEl);
      body.querySelector("#tower-start").onclick = async () => {
        const bet = Number(betEl().value);
        if (!validateBet(bet)) return;
        haptic("medium");
        try {
          const r = await api("/api/games/tower/start", { method:"POST", body:JSON.stringify({ bet }) });
          updateBalance(num(profile.balance) - bet);
          active = true; currentLevel = 0; minePositions = null;
          drawAll([]);
        } catch (e) { toast(e.message); }
      };
    } else {
      body.querySelector("#tower-cashout").onclick = async () => {
        haptic("medium");
        try {
          const r = await api("/api/games/tower/cashout", { method:"POST" });
          updateBalance(num(profile.balance) + num(r.payout));
          body.querySelector("#tower-result").innerHTML = `<span style="color:var(--green); font-weight:700;">Забрано +${num(r.profit).toFixed(2)} (×${r.mult})</span>`;
          active = false;
          setTimeout(() => { currentLevel = 0; drawAll([]); }, 2000);
        } catch (e) { toast(e.message); }
      };
      bindDoors();
    }
  }
  function bindDoors() {
    const board = body.querySelector("#tower-board");
    board.querySelectorAll(".tower-door.active").forEach(el => {
      el.onclick = async () => {
        const door = Number(el.dataset.door);
        haptic();
        try {
          const r = await api("/api/games/tower/step", { method:"POST", body:JSON.stringify({ door }) });
          if (r.lost) {
            active = false;
            const board = body.querySelector("#tower-board");
            board.querySelectorAll(".tower-door").forEach(el2 => {
              const l = Number(el2.dataset.level);
              const d = Number(el2.dataset.door);
              el2.classList.add("locked");
              if (r.mine !== undefined && l === currentLevel) {
                el2.innerText = d === r.mine ? "💣" : "🚪";
                if (d === r.mine) el2.classList.add("mine");
              } else {
                el2.innerText = "🚪";
              }
            });
            body.querySelector("#tower-result").innerHTML = `<span style="color:var(--red); font-weight:700;">💥 Мина на уровне ${currentLevel+1}</span>`;
            setTimeout(() => { currentLevel = 0; drawAll([]); }, 2000);
          } else {
            currentLevel = r.level;
            const revealed = [];
            for (let i = 0; i < r.level; i++) {
              revealed.push({ level: i, door: 0 });
            }
            // последний уровень - оставим открытым нужный
            if (revealed.length) revealed[revealed.length-1] = { level: r.level-1, door };
            drawAll(revealed);
          }
        } catch (e) { toast(e.message); }
      };
    });
  }
  drawAll([]);
}

setInterval(async () => {
  try { const p = await api("/api/profile"); profile = p; renderProfile(); } catch {}
}, 10000);
setInterval(loadLive, 8000);

renderGames();
loadLive();
init();
</script>
